 <!DOCTYPE html>
<html><!-- redeploy -->
<head>
  <title>SprinklerTakeoff</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
      color: #111;
    }

    .hero {
      padding: 80px 20px;
      text-align: center;
      background: white;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }

    p {
      font-size: 20px;
      color: #555;
      max-width: 700px;
      margin: auto;
    }

    .button {
      display: inline-block;
      margin-top: 30px;
      padding: 16px 28px;
      background: black;
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-weight: bold;
    }

    .section {
      max-width: 1000px;
      margin: auto;
      padding: 60px 20px;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      margin-bottom: 20px;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    button {
      padding: 14px 22px;
      border: none;
      background: black;
      color: white;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    .result {
      margin-top: 20px;
      background: #fafafa;
      padding: 20px;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <section class="hero">
    <h1>SprinklerTakeoff</h1>
    <p>
      Generate sprinkler material lists in minutes.
      Built for contractors, estimators, and fire protection professionals.
    </p>

    <a class="button" href="#calculator">Open Calculator</a>
  </section>

  <section class="section" id="calculator">
    <div class="card">
      <h2>Material Calculator</h2>

      <label>Number of Upright Heads</label>
      <input type="number" id="uprights" value="60" />

      <label>Number of Pendent Heads</label>
      <input type="number" id="pendents" value="44" />

      <label>Number of Sidewall Heads</label>
      <input type="number" id="sidewalls" value="3" />

      <button onclick="calculate()">Generate Material List</button>

      <div class="result" id="results"></div>
    </div>
  </section>

  <script>
    function calculate() {
      const uprights = parseInt(document.getElementById('uprights').value);
      const pendents = parseInt(document.getElementById('pendents').value);
      const sidewalls = parseInt(document.getElementById('sidewalls').value);

      const totalHeads = uprights + pendents + sidewalls;

      const pipeLengths = Math.ceil(totalHeads * 0.75);
      const couplings = Math.ceil(pipeLengths * 1.5);
      const hangers = Math.ceil(pipeLengths * 2);

      document.getElementById('results').innerHTML = `
        <h3>Estimated Material List</h3>

        <p><strong>Total Heads:</strong> ${totalHeads}</p>

        <p><strong>2” Pipe Lengths:</strong> ${pipeLengths}</p>

        <p><strong>2” Grooved Couplings:</strong> ${couplings}</p>

        <p><strong>2” Hangers:</strong> ${hangers}</p>

        <p><strong>2” x 3/4 Mechanical Tees:</strong> ${uprights}</p>

        <p><strong>2” x 1 Mechanical Tees:</strong> ${pendents}</p>

        <p><strong>2” x 1/2 Mechanical Tees:</strong> ${sidewalls}</p>
      `;
    }

    calculate();
  </script>

</body>
</html>
